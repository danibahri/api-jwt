<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .token-container {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gray-100 pt-12">
    <div class="max-w-md mx-auto px-4">
      <div class="bg-white rounded-xl shadow-sm p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Login</h2>

        <div
          id="error-alert"
          class="hidden mb-6 p-4 bg-red-50 text-red-700 rounded-lg"
        ></div>

        <form id="loginForm" class="space-y-6">
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Email</label
            >
            <input
              type="email"
              id="email"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Password</label
            >
            <input
              type="password"
              id="password"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <button
            type="submit"
            class="w-full py-2 px-4 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
            Login
          </button>
        </form>

        <div
          id="tokenContainer"
          class="token-container mt-8 bg-white rounded-xl shadow-md p-6"
        >
          <h5 class="text-lg font-semibold text-gray-900 mb-4">
            Token JWT Anda
          </h5>
          <div class="flex gap-2 mb-4">
            <input
              type="text"
              id="tokenInput"
              readonly
              class="flex-1 px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-gray-700"
            />
            <button
              id="copyBtn"
              class="px-4 py-2 text-indigo-600 font-medium bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors"
            >
              Copy
            </button>
          </div>
          <small class="text-gray-500 text-sm"
            >Token berlaku selama 1 jam</small
          >
          <div class="mt-4">
            <a
              href="dashboard.html"
              class="block w-full py-2 px-4 bg-green-600 text-white text-center font-medium rounded-lg hover:bg-green-700 transition-colors"
            >
              Lanjut ke Dashboard
            </a>
          </div>
        </div>

        <div class="mt-6 text-center">
          <p class="text-gray-600">
            Belum punya akun?
            <a
              href="register.html"
              class="text-indigo-600 hover:text-indigo-800 font-medium"
              >Register</a
            >
          </p>
        </div>
      </div>
    </div>

    <script>
      // Logika JavaScript tetap sama
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          fetch("http://api-jwt.test/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: email,
              password: password,
            }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status) {
                document.getElementById("error-alert").classList.add("hidden");
                document.getElementById("tokenContainer").style.display =
                  "block";
                document.getElementById("tokenInput").value = data.token;

                // Simpan token ke localStorage
                localStorage.setItem("jwt_token", data.token);
              } else {
                document.getElementById("error-alert").textContent =
                  data.message;
                document
                  .getElementById("error-alert")
                  .classList.remove("hidden");
                document.getElementById("tokenContainer").style.display =
                  "none";
              }
            })
            .catch((error) => {
              document.getElementById("error-alert").textContent =
                "Terjadi kesalahan. Silakan coba lagi.";
              document.getElementById("error-alert").classList.remove("hidden");
              document.getElementById("tokenContainer").style.display = "none";
            });
        });

      document.getElementById("copyBtn").addEventListener("click", function () {
        const tokenInput = document.getElementById("tokenInput");
        tokenInput.select();
        document.execCommand("copy");
        this.textContent = "Copied!";
        setTimeout(() => {
          this.textContent = "Copy";
        }, 2000);
      });
    </script>
  </body>
</html>
